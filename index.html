<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumuman Kelulusan TKA - MIS AN-NUR GIRIREJO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
        }
        /* Efek Kembang Api */
        .fw {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            animation: explode 1.5s ease-out infinite;
        }
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="sticky top-0 z-50 bg-gradient-to-r from-blue-700 via-blue-600 to-cyan-600 text-white shadow-md">
        <div class="h-8 w-full bg-transparent"></div>
        
        <div class="container mx-auto px-4 pb-5 pt-1 flex flex-col sm:flex-row items-center justify-center gap-4 text-center sm:text-left">
            <img src="https://iili.io/C30tEf2.md.png" alt="Logo MIS AN-NUR GIRIREJO" class="h-20 w-auto object-contain drop-shadow-md">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-wide">PENGUMUMAN HASIL TKA</h1>
                <p class="text-lg sm:text-xl font-medium text-blue-100">MIS AN-NUR GIRIREJO</p>
                <p class="text-sm text-cyan-100 font-light">Tahun Pelajaran 2025/2026</p>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-10 max-w-3xl">
        
        <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-10 border border-slate-100">
            
            <div id="search-section">
                <div class="bg-green-50 border border-green-200 text-green-800 rounded-xl p-4 text-center font-semibold mb-8 animate-bounce">
                    🎉 Pengumuman Sudah Dibuka!
                </div>
                
                <div class="space-y-4 max-w-md mx-auto">
                    <div>
                        <label for="student-name" class="block text-sm font-medium text-slate-700 mb-2">Masukkan Nama Lengkap Siswa:</label>
                        <input type="text" id="student-name" placeholder="CONTOH: MUHAMMAD IQBAL AL GHIFARY" 
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition uppercase text-center font-medium tracking-wide">
                    </div>
                    <button type="button" id="btn-cek"
                        class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold py-3 px-6 rounded-xl shadow-lg shadow-blue-200 transition transform hover:-translate-y-0.5 active:translate-y-0">
                        Cek Hasil TKA
                    </button>
                </div>
            </div>

            <div id="result-section" class="mt-10 hidden border-t border-slate-100 pt-8 relative overflow-hidden min-h-[250px] rounded-xl">
                </div>

        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm border-t border-slate-800">
        <p>&copy; 2026 <span class="font-semibold text-slate-300">MIS AN-NUR GIRIREJO</span>. All Rights Reserved.</p>
    </footer>

    <script>
        // DATA SISWA
        const studentData = [
            { nama: "MUHAMMAD IQBAL AL GHIFARY", nisn: "3135933892", mtk: 46.67, bin: 70.00 },
            { nama: "MOHAMAD ALWI SHOLAHUDDIN", nisn: "3130762103", mtk: 46.67, bin: 70.00 },
            { nama: "HABIBATU ANGJELA BARIK", nisn: "3133154891", mtk: 23.33, bin: 60.00 },
            { nama: "MOHAMAD WEIDHA TRIATMA MULIA", nisn: "3130727857", mtk: 46.67, bin: 36.67 },
            { nama: "MUCHAMMAD RASYAD AL AZHAR", nisn: "3149232223", mtk: 43.33, bin: 43.33 },
            { nama: "AULIYA FATIMATUZ ZAHRA", nisn: "3130954778", mtk: 43.33, bin: 73.33 },
            { nama: "FANINA ARMETA PUTRI", nisn: "0121934925", mtk: 26.67, bin: 63.33 },
            { nama: "ALIFA DZATIL IZZA", nisn: "0148782057", mtk: 46.67, bin: 70.00 },
            { nama: "FAUZIYAH ZAIDA HILYATUR RAHMAH", nisn: "3131874320", mtk: 60.00, bin: 73.33 },
            { nama: "ANDIKA NURIYAN SAPUTRA", nisn: "3135643526", mtk: 23.33, bin: 56.67 },
            { nama: "MUHAMAD ANDIVA ERLANGGA", nisn: "3128583119", mtk: 63.33, bin: 83.33 },
            { nama: "AHMAD ARSYAD RIFA'I", nisn: "3131502927", mtk: 46.67, bin: 70.00 },
            { nama: "WISNU ADITYA WARDANA", nisn: "0139015207", mtk: 33.33, bin: 33.33 },
            { nama: "AFAN LOU PRAYIYING PUTRI", nisn: "3136715125", mtk: 46.67, bin: 83.33 },
            { nama: "AINUN SINTA RAHMAWATI", nisn: "0135121493", mtk: 40.00, bin: 60.00 },
            { nama: "ANNISA FITIYA RIZKY MAULIDA", nisn: "0142592643", mtk: 70.00, bin: 86.67 },
            { nama: "NIHAYATUL WAFIROH", nisn: "0136686027", mtk: 50.00, bin: 63.33 },
            { nama: "DIDIBBIYAH AIDIST", nisn: "3135981949", mtk: 50.00, bin: 60.00 },
            { nama: "MUHAMMAD ANDRE AJI MAULANA", nisn: "3134834613", mtk: 40.00, bin: 60.00 },
            { nama: "ZAKHWARIL ULA", nisn: "0146342832", mtk: 33.33, bin: 53.33 },
            { nama: "MUHAMMAD RAFAEL ALDIANTO", nisn: "3138455247", mtk: 26.67, bin: 46.67 },
            { nama: "HERVIANSYAH NUR ELFARISKI", nisn: "0146827087", mtk: 36.67, bin: 30.00 },
            { nama: "HIDE AKBAR FIRDAUS ZAM-ZAM", nisn: "3137295515", mtk: 36.67, bin: 60.00 },
            { nama: "SEPTIAN ADI PRASETYO", nisn: "3132684335", mtk: 33.33, bin: 40.00 },
            { nama: "MUHAMMAD MUZAKKI", nisn: "3139838184", mtk: 40.00, bin: 70.00 },
            { nama: "IMROATUL MUNA ASYIFA", nisn: "3132659001", mtk: 23.33, bin: 66.67 }
        ];

        const resultSection = document.getElementById("result-section");

        // ANIMASI LOGIC
        let activeIntervals = [];
        function clearAnimations() {
            activeIntervals.forEach(clearInterval);
            activeIntervals = [];
            const oldFws = document.querySelectorAll('.fw');
            oldFws.forEach(f => f.remove());
        }

        function createFireworkEffect(container) {
            const colors = ['#facc15', '#60a5fa', '#34d399', '#f472b6', '#a78bfa'];
            const interval = setInterval(() => {
                const originX = Math.random() * 100;
                const originY = Math.random() * 100;
                
                for(let i=0; i<20; i++) {
                    const p = document.createElement('div');
                    p.className = 'fw';
                    p.style.left = originX + '%';
                    p.style.top = originY + '%';
                    p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = Math.random() * 80 + 40;
                    p.style.setProperty('--x', Math.cos(angle) * velocity + 'px');
                    p.style.setProperty('--y', Math.sin(angle) * velocity + 'px');
                    
                    container.appendChild(p);
                    setTimeout(() => p.remove(), 1500);
                }
            }, 800);
            activeIntervals.push(interval);
        }

        // AKSI CEK HASIL
        document.getElementById("btn-cek").addEventListener("click", function() {
            clearAnimations();

            const inputRaw = document.getElementById("student-name").value;
            const inputName = inputRaw.trim().replace(/\s+/g, ' ').toUpperCase();

            if (!inputName) {
                alert("Silakan masukkan nama siswa terlebih dahulu!");
                return;
            }

            const student = studentData.find(s => s.nama === inputName);
            resultSection.classList.remove("hidden");
            
            if (student) {
                resultSection.innerHTML = `
                    <div class="p-6 sm:p-8 bg-gradient-to-br from-green-50 to-emerald-100 border-4 border-green-500 rounded-xl shadow-inner text-center">
                        <div class="text-5xl mb-3">⭐🏆⭐</div>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-green-700 tracking-wide mb-2">SURAT KETERANGAN</h2>
                        <p class="text-xs text-green-600 tracking-widest font-mono uppercase mb-6">No: MIS-AN/TKA/${student.nisn}/2026</p>
                        
                        <p class="text-slate-600 text-sm italic">Diberitahukan kepada siswa:</p>
                        <h3 class="text-xl sm:text-2xl font-bold text-slate-800 my-2">${student.nama}</h3>
                        <p class="text-slate-700 text-sm font-medium mb-4">NISN: <span class="bg-white px-2 py-0.5 rounded border border-green-200">${student.nisn}</span></p>
                        
                        <div class="inline-block bg-green-600 text-white font-bold px-8 py-2.5 rounded-full text-md shadow-md tracking-wider mb-6">
                            HASIL TKA
                        </div>
                        
                        <div class="max-w-xs mx-auto bg-white p-4 rounded-xl shadow-sm border border-green-100 text-left">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">DAFTAR NILAI HASIL TKA</p>
                            <div class="flex justify-between border-b py-1 text-sm"><span class="text-slate-600">Matematika:</span> <span class="font-bold text-slate-800">${student.mtk}</span></div>
                            <div class="flex justify-between py-1 text-sm"><span class="text-slate-600">Bahasa Indonesia:</span> <span class="font-bold text-slate-800">${student.bin}</span></div>
                        </div>
                    </div>
                `;
                createFireworkEffect(resultSection);
            } else {
                resultSection.innerHTML = `
                    <div class="p-6 bg-amber-50 border border-amber-300 rounded-xl text-center text-amber-800">
                        <h4 class="font-bold text-lg mb-1">Nama Siswa Tidak Ditemukan</h4>
                        <p class="text-sm font-light">Pastikan penulisan nama lengkap sudah benar sesuai data rapor sekolah (Gunakan HURUF KAPITAL).</p>
                    </div>
                `;
            }

            setTimeout(() => {
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        });
    </script>
</body>
</html>
